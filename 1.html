<!DOCTYPE html>
<html lang="te">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Media Section</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
    }

    .social-section {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 60px 0;
      position: relative;
      overflow: hidden;
    }

    .social-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(99, 179, 237, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 50%, rgba(237, 137, 54, 0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .section-subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }

    .social-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .social-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      text-decoration: none;
      color: inherit;
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 26px;
    }

    .ig-wrap {
      background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .fb-wrap {
      background: #1877f2;
    }

    .yt-wrap {
      background: #ff0000;
    }

    .tw-wrap {
      background: #1da1f2;
    }

    .li-wrap {
      background: #0a66c2;
    }

    .wa-wrap {
      background: #25d366;
    }

    .gmb-wrap {
      background: #4285f4;
    }

    .web-wrap {
      background: #6366f1;
    }

    .quora-wrap {
      background: #b92b27;
    }

    .pin-wrap {
      background: #e60023;
    }

    .social-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 2px;
    }

    .social-handle {
      font-size: 0.75rem;
      color: #64748b;
    }

    .divider-line {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin: 40px 0 30px;
    }

    .appt-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      padding: 14px 40px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.35);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .appt-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(102, 126, 234, 0.55);
      color: white;
    }

    .appt-btn i {
      font-size: 1.1rem;
    }

    .badge-live {
      background: #22c55e;
      color: white;
      font-size: 0.65rem;
      padding: 2px 7px;
      border-radius: 20px;
      vertical-align: middle;
      margin-left: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>

  <!-- ========== SOCIAL MEDIA SECTION ========== -->
  <section class="social-section">
    <div class="container">

      <!-- Heading -->

      <!-- Social Icons Row 1 -->
      <div class="row g-3 justify-content-center mb-3">

        <!-- Instagram -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://instagram.com/yourhandle" target="_blank" class="social-card">
            <div class="icon-wrap ig-wrap">
              <i class="bi bi-instagram text-white"></i>
            </div>
            <div class="social-name">Instagram</div>
            <div class="social-handle">@yourhandle</div>
          </a>
        </div>

        <!-- Facebook -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://facebook.com/yourpage" target="_blank" class="social-card">
            <div class="icon-wrap fb-wrap">
              <i class="bi bi-facebook text-white"></i>
            </div>
            <div class="social-name">Facebook</div>
            <div class="social-handle">/yourpage</div>
          </a>
        </div>

        <!-- YouTube -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://youtube.com/@yourchannel" target="_blank" class="social-card">
            <div class="icon-wrap yt-wrap">
              <i class="bi bi-youtube text-white"></i>
            </div>
            <div class="social-name">YouTube</div>
            <div class="social-handle">@yourchannel</div>
          </a>
        </div>

        <!-- Twitter / X -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://twitter.com/yourhandle" target="_blank" class="social-card">
            <div class="icon-wrap tw-wrap">
              <i class="bi bi-twitter-x text-white"></i>
            </div>
            <div class="social-name">Twitter / X</div>
            <div class="social-handle">@yourhandle</div>
          </a>
        </div>

        <!-- LinkedIn -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://linkedin.com/in/yourprofile" target="_blank" class="social-card">
            <div class="icon-wrap li-wrap">
              <i class="bi bi-linkedin text-white"></i>
            </div>
            <div class="social-name">LinkedIn</div>
            <div class="social-handle">/yourprofile</div>
          </a>
        </div>

        <!-- WhatsApp -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://wa.me/919999999999" target="_blank" class="social-card">
            <div class="icon-wrap wa-wrap">
              <i class="bi bi-whatsapp text-white"></i>
            </div>
            <div class="social-name">WhatsApp</div>
            <div class="social-handle">Chat Now</div>
          </a>
        </div>

      </div>

      <!-- Social Icons Row 2: Website + GMB + Quora + Pinterest -->
      <div class="row g-3 justify-content-center">

        <!-- Website -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://yourwebsite.com" target="_blank" class="social-card">
            <div class="icon-wrap web-wrap">
              <i class="bi bi-globe2 text-white"></i>
            </div>
            <div class="social-name">Website</div>
            <div class="social-handle">yourwebsite.com</div>
          </a>
        </div>

        <!-- Google My Business -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://maps.google.com/?cid=YOURGMBID" target="_blank" class="social-card">
            <div class="icon-wrap gmb-wrap">
              <i class="bi bi-google text-white"></i>
            </div>
            <div class="social-name">Google Business</div>
            <div class="social-handle">Review us ⭐</div>
          </a>
        </div>

        <!-- Quora -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://www.quora.com/profile/yourprofile" target="_blank" class="social-card">
            <div class="icon-wrap quora-wrap">
              <i class="bi bi-quora text-white"></i>
            </div>
            <div class="social-name">Quora</div>
            <div class="social-handle">/yourprofile</div>
          </a>
        </div>

        <!-- Pinterest -->
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <a href="https://www.pinterest.com/yourprofile" target="_blank" class="social-card">
            <div class="icon-wrap pin-wrap">
              <i class="bi bi-pinterest text-white"></i>
            </div>
            <div class="social-name">Pinterest</div>
            <div class="social-handle">/yourprofile</div>
          </a>
        </div>

      </div>

      <!-- Divider -->
      <div class="divider-line"></div>

      <!-- Appointment Button -->
      <div class="text-center">

        <a href="https://calendly.com/yourlink" target="_blank" class="appt-btn">
          <i class="bi bi-calendar2-check"></i>
          Appointment Book చేయండి
        </a>
      </div>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
